<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consistent Hash Ring</title><link rel="stylesheet" href="./style.css"></head><body><header><p class="eyebrow">DISTRIBUTED SYSTEMS · EDUCATION</p><h1>Consistent Hash Ring</h1><p>See how keys map to nodes and how virtual nodes spread ownership around a hash ring.</p></header><main><section class="panel"><h2>Cluster</h2><label>Node names<input id="nodes" value="alpha, beta, gamma"></label><label>Virtual nodes per server <strong id="vn-label">24</strong><input id="vnodes" type="range" min="1" max="80" value="24"></label><label>Keys to map<textarea id="keys" rows="8">user:1001\nuser:1002\norders:42\nimage:logo.svg\nsession:abc</textarea></label><button id="run" class="primary">Rebuild ring and map keys</button><p id="error" class="error" role="alert"></p></section><section class="panel"><div class="head"><h2>Hash ring</h2><span id="ring-count" class="tag"></span></div><svg id="ring" viewBox="0 0 420 290" role="img" aria-label="Consistent hash ring with virtual nodes"></svg><p id="legend" class="legend"></p><h2>Key ownership</h2><div class="tablewrap"><table><thead><tr><th>Key</th><th>Hash position</th><th>Assigned node</th></tr></thead><tbody id="mapping"></tbody></table></div></section></main><footer>Deterministic FNV-1a demonstration · no network or cluster required</footer><script type="module" src="./app.js"></script></body></html>
